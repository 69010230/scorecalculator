<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScoreCal</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c1f24; --muted:#6b7280; --accent:#2563eb; --ok:#16a34a; --bad:#dc2626; --border:#e5e7eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161a; --card:#1d2026; --text:#e8eaed; --muted:#9aa0a6; --border:#2d3139; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,"Noto Sans Thai",sans-serif; padding:16px; }
  main { max-width:480px; margin:0 auto; }
  h1 { font-size:1.4rem; margin:8px 0 16px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:16px; }
  label { display:block; font-size:.9rem; color:var(--muted); margin-bottom:12px; }
  input { display:block; width:100%; margin-top:4px; padding:10px; font-size:1rem; border:1px solid var(--border); border-radius:8px; background:var(--bg); color:var(--text); }
  .row { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border); }
  .row:last-child { border-bottom:0; }
  .row b { font-variant-numeric: tabular-nums; }
  #sheet { display:flex; flex-wrap:wrap; gap:3px; margin-top:12px; }
  .cell { width:14px; height:14px; border-radius:3px; background:var(--ok); }
  .cell.w { background:var(--bad); }
  #note { color:var(--bad); font-size:.9rem; margin:0; }
  .hint { font-size:.8rem; color:var(--muted); margin:8px 0 0; }
</style>
</head>
<body>
<main>
  <h1>ScoreCal</h1>
  <form id="f" class="card">
    <label>คะแนนที่อยากได้ (เต็ม 100)<input id="goal" type="number" step="any" inputmode="decimal"></label>
    <label>คะแนนเก็บแล็บที่ได้<input id="lab" type="number" step="any" inputmode="decimal"></label>
    <label>คะแนนเก็บควิซที่ได้<input id="quiz" type="number" step="any" inputmode="decimal"></label>
    <label>คะแนนกลางภาค (เต็ม 100)<input id="midterm" type="number" step="any" inputmode="decimal"></label>
    <label>คะแนนต่อข้อ<input id="ppq" type="number" step="any" inputmode="decimal" value="2"></label>
  </form>

  <section class="card">
    <p id="note" hidden></p>
    <div class="row"><span>คะแนนสอบปลายภาคที่ต้องได้</span><b id="need">–</b></div>
    <div class="row"><span>ถ้าทำถูก ≥ 90% ต้องทำ (คะแนน)</span><b id="ninety">–</b></div>
    <div class="row"><span>จำนวนข้อที่ต้องทำ</span><b id="items">–</b></div>
    <div class="row"><span>ต้องทำถูก</span><b id="right">–</b></div>
    <div class="row"><span>ผิดได้</span><b id="wrong">–</b></div>
    <div id="sheet"></div>
    <p class="hint">เขียวคือข้อที่ต้องถูก แดงคือข้อที่ผิดได้ (สมมติข้อละ 2 คะแนน)</p>
  </section>
</main>

<script>
  (function () {
    var f = Math.fround;
    var ids = ["goal", "lab", "quiz", "midterm", "ppq"];
    var el = {};
    ["need", "ninety", "items", "right", "wrong", "sheet", "note"].forEach(function (k) { el[k] = document.getElementById(k); });
    ids.forEach(function (k) { el[k] = document.getElementById(k); });

    function num(id) { var v = parseFloat(el[id].value); return isFinite(v) ? v : NaN; }

    function compute() {
      var goal = num("goal"), lab = num("lab"), quiz = num("quiz"), midterm = num("midterm"), ppq = num("ppq");
      var bad = [goal, lab, quiz, midterm].some(isNaN) || !(ppq > 0);
      if (bad) {
        ["need", "ninety", "items", "right", "wrong"].forEach(function (k) { el[k].textContent = "–"; });
        el.sheet.innerHTML = "";
        el.note.hidden = false;
        el.note.textContent = "กรอกตัวเลขให้ครบทุกช่อง และให้คะแนนต่อข้อมากกว่า 0";
        return;
      }
      // Same float arithmetic order as the C program.
      var mid = f(f(f(midterm) / 100) * 35);
      var real = f(f(f(f(goal) - f(lab)) - f(quiz)) - mid);
      var need = Math.ceil(real);
      var ninety = Math.ceil(f(need - 10));
      var items = Math.ceil(f(ninety / f(ppq)));
      var right = Math.ceil(f(f(items / 10) * 9));
      var wrong = items - right;

      el.need.textContent = need;
      el.ninety.textContent = ninety;
      el.items.textContent = items + " ข้อ";
      el.right.textContent = right + " ข้อ";
      el.wrong.textContent = wrong + " ข้อ";

      var html = "";
      if (items > 0 && items <= 150) {
        for (var i = 0; i < items; i++) html += '<span class="cell' + (i < right ? "" : " w") + '"></span>';
      }
      el.sheet.innerHTML = html;

      var msg = "";
      if (need <= 0) msg = "คะแนนเก็บของคุณถึงเป้าแล้ว ไม่ต้องใช้คะแนนปลายภาคเพิ่ม";
      else if (need > 100) msg = "คะแนนที่ต้องได้เกิน 100 ซึ่งเกินคะแนนเต็มปลายภาค ลองลดเป้าหมายลง";
      else if (ninety <= 0) msg = "หลังหัก 10 คะแนนแล้วไม่เหลือข้อที่ต้องทำ";
      else if (items > 150) msg = "จำนวนข้อมากเกินไป จึงไม่แสดงช่องถูก/ผิด";
      el.note.hidden = !msg;
      el.note.textContent = msg;
    }

    ids.forEach(function (k) { el[k].addEventListener("input", compute); });
    document.getElementById("f").addEventListener("submit", function (e) { e.preventDefault(); });
    compute();
  })();
</script>
</body>
</html>
